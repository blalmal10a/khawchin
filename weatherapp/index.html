<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khawchin</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1e2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --line: #e5e7eb;
    --ok: #16a34a;
    --warn: #d97706;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }
  header {
    padding: 24px 28px 8px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
  .controls {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 28px 4px;
  }
  #refreshBtn {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #refreshBtn:hover { filter: brightness(1.08); }
  #refreshBtn:disabled { opacity: 0.55; cursor: wait; }
  #lastUpdated { color: var(--muted); font-size: 13px; }

  main.grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    padding: 16px 28px 8px;
  }
  @media (max-width: 900px) { main.grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  .card.full-width {
    grid-column: 100%;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .card-head h2 { margin: 0; font-size: 16px; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; background: #eef2f7; color: var(--muted);
  }
  .badge.ok    { background: #dcfce7; color: var(--ok); }
  .badge.warn  { background: #fef3c7; color: var(--warn); }
  .badge.error { background: #fee2e2; color: var(--error); }
  .badge.loading { background: #e0e7ff; color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 18px; text-align: left; border-bottom: 1px solid var(--line); }
  th {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); background: #fafbfd;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f8fafc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.empty td { color: var(--muted); font-style: italic; text-align: center; }

  footer { padding: 10px 28px 26px; color: var(--muted); font-size: 12.5px; }
  footer code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>Khawchin</h1>
    <p>Ruah sur beisei a nih hun tur chiah tarlan a ni</p>
  </header>

  <div class="controls">
    <button id="refreshBtn">Refresh</button>
    <span id="lastUpdated"></span>
  </div>

  <main class="grid">
    <section class="card" id="accuCard">
      <div class="card-head">
        <h2>AccuWeather</h2>
        <span class="badge loading" id="accuStatus">loading&hellip;</span>
      </div>
      <table>
        <thead>
          <tr><th>Time</th><th class="num">Precip</th><th class="num">Rain</th></tr>
        </thead>
        <tbody id="accuBody"></tbody>
      </table>
    </section>

    <section class="card" id="wuCard">
      <div class="card-head">
        <h2>Wunderground</h2>
        <span class="badge loading" id="wuStatus">loading&hellip;</span>
      </div>
      <table>
        <thead>
          <tr><th>Time</th><th class="num">Precip</th><th class="num">Rain</th></tr>
        </thead>
        <tbody id="wuBody"></tbody>
      </table>
    </section>

    <section class="card full-width" id="accuAllCard">
      <div class="card-head">
        <h2>AccuWeather (All Raw Data)</h2>
        <span class="badge loading" id="accuAllStatus">loading&hellip;</span>
      </div>
      <table>
        <thead>
          <tr><th>Time</th><th class="num">Precip</th><th class="num">Rain</th></tr>
        </thead>
        <tbody id="accuAllBody"></tbody>
      </table>
    </section>

    <section class="card full-width" id="wuAllCard">
      <div class="card-head">
        <h2>Wunderground (All Raw Data)</h2>
        <span class="badge loading" id="wuAllStatus">loading&hellip;</span>
      </div>
      <table>
        <thead>
          <tr><th>Time</th><th class="num">Precip</th><th class="num">Rain</th></tr>
        </thead>
        <tbody id="wuAllBody"></tbody>
      </table>
    </section>
  </main>

<script>
"use strict";

/* ============================= CONFIG ============================= */

let endpoint;
if (window.location.protocol === 'https:') {
  // production
  endpoint = 'PRODUCTION_ENDPOINT';
} else {
  endpoint = 'cors.test';
}

function getTomorrowDateString() {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const year = tomorrow.getFullYear();
  const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
  const day = String(tomorrow.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

const SOURCES = {
  accuweather: {
    label: "AccuWeather",
    buildUrls() {
      const base = "https://www.accuweather.com/en/in/aizawl/189561/hourly-weather-forecast/189561";
      return [
        { dayLabel: "Today", url: base },
        { dayLabel: "Tomorrow", url: `${base}?day=2` }
      ];
    },
    parse: parseAccuWeather,
    statusId: "accuStatus",
    bodyId: "accuBody",
    fetchVia: ["direct"],
  },
  accuweather_all: {
    label: "AccuWeather (All)",
    all: true,
    buildUrls() {
      const base = "https://www.accuweather.com/en/in/aizawl/189561/hourly-weather-forecast/189561";
      return [
        { dayLabel: "Today", url: base },
        { dayLabel: "Tomorrow", url: `${base}?day=2` }
      ];
    },
    parse: parseAccuWeather,
    statusId: "accuAllStatus",
    bodyId: "accuAllBody",
    fetchVia: ["direct"],
  },
  wunderground: {
    label: "Wunderground",
    buildUrls() {
      const tomorrow = getTomorrowDateString();
      return [
        { dayLabel: "Today", url: "https://www.wunderground.com/hourly/in/aizawl" },
        { dayLabel: "Tomorrow", url: `https://www.wunderground.com/hourly/in/aizawl/date/${tomorrow}` }
      ];
    },
    parse: parseWunderground,
    statusId: "wuStatus",
    bodyId: "wuBody",
    fetchVia: ["proxy"],
  },
  wunderground_all: {
    label: "Wunderground (All)",
    all: true,
    buildUrls() {
      const tomorrow = getTomorrowDateString();
      return [
        { dayLabel: "Today", url: "https://www.wunderground.com/hourly/in/aizawl" },
        { dayLabel: "Tomorrow", url: `https://www.wunderground.com/hourly/in/aizawl/date/${tomorrow}` }
      ];
    },
    parse: parseWunderground,
    statusId: "wuAllStatus",
    bodyId: "wuAllBody",
    fetchVia: ["proxy"],
  },
};

/* ========================= FETCH HELPERS ========================== */

function readHtml(res) {
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text().then((html) => {
    if (html.length < 500) throw new Error("response too small (bot-check page?)");
    return html;
  });
}

async function fetchDirect(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    return await readHtml(res);
  } finally {
    clearTimeout(timer);
  }
}

async function fetchViaProxy(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);

  const proxyBase = endpoint.startsWith("http")
    ? endpoint
    : `${window.location.protocol}//${endpoint}`;

  const proxyUrl = `${proxyBase.replace(/\/+$/, '')}/?url=${encodeURIComponent(url)}`;

  try {
    const res = await fetch(proxyUrl, { signal: ctrl.signal });
    return await readHtml(res);
  } finally {
    clearTimeout(timer);
  }
}

const FETCH_STRATEGIES = {
  direct: fetchDirect,
  proxy: fetchViaProxy,
};

async function fetchWithStrategies(url, chain, { timeoutMs = 20000 } = {}) {
  const errors = [];
  for (const name of chain) {
    try {
      const html = await FETCH_STRATEGIES[name](url, timeoutMs);
      return { html, via: name };
    } catch (err) {
      errors.push(`${name}: ${err.message}`);
    }
  }
  throw new Error(errors.join(" | "));
}

/* ====================== ACCUWEATHER PARSER ======================== */

function parseAccuWeather(doc = document, all = false, dayLabel = "") {
  const wrapper = doc.querySelector(".hourly-wrapper.content-module");
  if (!wrapper) return [];

  const results = [];

  wrapper.querySelectorAll(".accordion-item.hour").forEach((item) => {
    const hourEl = item.querySelector("h2.date");
    if (!hourEl) return;
    const rawHour = hourEl.textContent.trim();

    const precipEl = item.querySelector(".precip");
    if (!precipEl) return;
    const precipMatch = precipEl.textContent.match(/\d+/);
    if (!precipMatch) return;
    const precip = parseInt(precipMatch[0], 10);

    let value = null;
    item.querySelectorAll(".panel p").forEach((p) => {
      const labelNode = Array.from(p.childNodes).find(
        (n) => n.nodeType === 3 && n.textContent.trim() !== ""
      );
      if (labelNode && labelNode.textContent.trim() === "Rain") {
        const valEl = p.querySelector("span.value");
        if (valEl) value = valEl.textContent.trim();
      }
    });

    if (all) {
      results.push({
        dayLabel,
        rawTime: rawHour,
        hour: `${dayLabel} ${rawHour}`,
        precip: precip + "%",
        value: value ?? "--",
      });
      return;
    }

    if (precip <= 49) return;
    if (value !== null) {
      results.push({
        dayLabel,
        rawTime: rawHour,
        hour: `${dayLabel} ${rawHour}`,
        precip: precip + "%",
        value
      });
    }
  });

  return results;
}

/* ====================== WUNDERGROUND PARSER ======================= */

function wuAmountToMm(text) {
  if (!text) return null;
  const match = text.match(/([\d.]+)\s*(in|inch|inches|mm|millimet(?:er|re)s?)?/i);
  if (!match || match[1] === "" || match[1] === ".") return null;

  const amount = parseFloat(match[1]);
  if (Number.isNaN(amount)) return null;

  const unit = (match[2] || "mm").toLowerCase();
  const mm = unit.startsWith("in") ? amount * 25.4 : amount;

  return Math.round(mm * 100) / 100 + " mm";
}

function parseWunderground(doc = document, all = false, dayLabel = "") {
  const wrapper = doc.querySelector(".table-scroll");
  if (!wrapper) return [];
  const tbody = wrapper.querySelector("tbody");
  if (!tbody) return [];

  const results = [];

  tbody.querySelectorAll("tr").forEach((tr) => {
    const cells = tr.querySelectorAll("td");
    if (cells.length < 6) return;

    const time = cells[0].textContent.trim();
    const precipText = cells[4].textContent.trim();
    const amountText = cells[5].textContent.trim();

    const pctMatch = precipText.match(/\d+/);

    if (all) {
      results.push({
        dayLabel,
        rawTime: time,
        hour: `${dayLabel} ${time}`,
        precip: pctMatch ? parseInt(pctMatch[0], 10) + "%" : precipText,
        value: wuAmountToMm(amountText) ?? amountText,
      });
      return;
    }

    if (!pctMatch) return;
    const percent = parseInt(pctMatch[0], 10);
    if (percent < 50) return;

    const value = wuAmountToMm(amountText);
    if (value === null) return;

    results.push({
      dayLabel,
      rawTime: time,
      hour: `${dayLabel} ${time}`,
      precip: percent + "%",
      value
    });
  });

  return results;
}

/* ============================ RENDER ============================== */

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = "badge" + (kind ? " " + kind : "");
}

function renderRows(tbody, rows) {
  tbody.innerHTML = "";
  if (!rows.length) {
    const tr = document.createElement("tr");
    tr.className = "empty";
    const td = document.createElement("td");
    td.colSpan = 3;
    td.textContent = "No matching hours";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  for (const row of rows) {
    const tr = document.createElement("tr");
    for (const cell of [row.hour, row.precip, row.value]) {
      const td = document.createElement("td");
      td.textContent = cell;
      if (cell !== row.hour) td.className = "num";
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

async function loadSource(key) {
  const src = SOURCES[key];
  const statusEl = document.getElementById(src.statusId);
  const bodyEl = document.getElementById(src.bodyId);

  setStatus(statusEl, "fetching\u2026", "loading");
  try {
    const targets = src.buildUrls();
    let allRows = [];
    let usedVias = new Set();

    for (const target of targets) {
      const { html, via } = await fetchWithStrategies(target.url, src.fetchVia);
      usedVias.add(via);
      const parsed = new DOMParser().parseFromString(html, "text/html");
      const rows = src.parse(parsed, src.all, target.dayLabel);
      allRows.push(...rows);
    }

    renderRows(bodyEl, allRows);
    const viaText = Array.from(usedVias).join("/");
    if (allRows.length) {
      setStatus(statusEl, `${allRows.length} hours`, "ok");
    } else {
      setStatus(statusEl, `No data / rain`, "warn");
    }
  } catch (err) {
    renderRows(bodyEl, []);
    setStatus(statusEl, "fetch failed", "error");
    if (bodyEl.querySelector("td")) {
      bodyEl.querySelector("td").textContent = "Fetch failed \u2014 " + err.message;
    }
  }
}

async function loadAll() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  await Promise.all([
    loadSource("accuweather"),
    loadSource("wunderground"),
    loadSource("accuweather_all"),
    loadSource("wunderground_all")
  ]);
  document.getElementById("lastUpdated").textContent =
    "Updated " + new Date().toLocaleTimeString();
  btn.disabled = false;
}

document.getElementById("refreshBtn").addEventListener("click", loadAll);
loadAll();
</script>
</body>
</html>
